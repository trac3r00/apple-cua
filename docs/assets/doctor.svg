<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" role="img" aria-label="apple-cua doctor output: every check ok, ready">
<rect width="880" height="436" rx="12" fill="#0d1117"/>
