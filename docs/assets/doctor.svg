<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="440" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">zsh — apple-cua doctor</text>
<g font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><text x="28" y="86"><tspan fill="#7ee787">$ </tspan><tspan fill="#ffffff" font-weight="600">apple-cua doctor</tspan></text><text x="28" y="110" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">macOS 26.6.2 on Apple Silicon (arm64)</tspan></text><text x="28" y="134" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">libsckit.dylib: x86_64 + arm64</tspan></text><text x="28" y="158" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">cursor-overlay: x86_64 + arm64</tspan></text><text x="28" y="182" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">helper app apple-cua-mcp.app (signature valid, bundled Node v26.7.0)</tspan></text><text x="28" y="206" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">server.js answered through the helper (Node v26.7.0, arm64)</tspan></text><text x="28" y="230" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">Accessibility granted to &quot;apple-cua-mcp&quot;</tspan></text><text x="28" y="254" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">Screen Recording granted to &quot;apple-cua-mcp&quot;</tspan></text><text x="28" y="278" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">Automation: &quot;apple-cua-mcp&quot; may control Finder</tspan></text><text x="28" y="302" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">ScreenCaptureKit capture loads in the helper</tspan></text><text x="28" y="326" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">omo: registered in ~/.omo/agent/mcp.json</tspan></text><text x="28" y="350" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  ok  </tspan><tspan fill="#c9d1d9">stop switch: not stopped (Control+Option+Command stops every agent)</tspan></text><text x="28" y="398" fill="#7ee787" font-weight="600">Ready: apple-cua is installed and holds its permissions.</text></g>
