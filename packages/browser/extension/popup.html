<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Browser-Skill-OmO</title>
		<style>
			:root { color-scheme: light dark; }
			body { font: 16px/1.5 system-ui, sans-serif; min-width: 18rem; padding: 1rem; }
